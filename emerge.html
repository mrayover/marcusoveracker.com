<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMERGE</title>
    <style>
      :root {
        --bg: #000;
        --fg: #fff;
        --muted: rgba(255, 255, 255, 0.75);
        --frame: rgba(255, 255, 255, 0.18);
      }

      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 18px 28px;
        box-sizing: border-box;
      }

      .title {
        font-size: clamp(40px, 7vw, 78px);
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        font-weight: 300;
        margin: 6px 0 14px;
        color: var(--fg);
        user-select: none;
      }

.stage {
  width: min(900px, 92vw);
  height: min(68vh, 640px);
  border: 1px solid var(--frame);
  display: grid;
  place-items: center;
  background: #000;
  box-sizing: border-box;
  overflow: hidden;            /* <-- add this */
}

.stage img {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain !important;
  display: block;
  min-width: 0;
  min-height: 0;
  user-select: none;
  -webkit-user-drag: none;
}



      .hint {
        margin-top: 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--muted);
        user-select: none;
      }

      .controls {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .btn {
        background: transparent;
        color: var(--fg);
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 10px 16px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease;
      }
      .btn:hover {
        border-color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.06);
      }

      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .counter {
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--muted);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="title">EMERGE</div>

      <div class="stage" id="stage" aria-label="Flipbook stage">
        <img id="img" alt="" loading="eager" />
      </div>

      <div class="hint">tap / click image to advance · arrow keys work too</div>

      <div class="controls">
        <div class="row">
          <button class="btn" id="prevBtn" type="button">Prev</button>
          <button class="btn" id="nextBtn" type="button">Next</button>
        </div>

        <div class="counter" id="counter">—</div>

        <button class="btn" type="button" onclick="window.location.href='works.html'">
          Return to Works
        </button>
      </div>
    </div>

    <script>
  const BASE = "/img/emerge/flipbook/";
  const MANIFEST = BASE + "manifest.json";

  const imgEl = document.getElementById("img");
  const counterEl = document.getElementById("counter");
  const stageEl = document.getElementById("stage");

  let ordered = [];
  let idx = 0;

  function painterOf(filename) {
    const i = filename.indexOf("_");
    return (i === -1 ? filename : filename.slice(0, i)).toLowerCase();
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Best-effort: try to avoid the same painter back-to-back
  function buildNonAdjacentOrder(files) {
    const groups = new Map();
    for (const f of files) {
      const p = painterOf(f);
      if (!groups.has(p)) groups.set(p, []);
      groups.get(p).push(f);
    }

    // shuffle within each painter bucket
    for (const [p, list] of groups.entries()) {
      groups.set(p, shuffle(list));
    }

    const painters = Array.from(groups.keys());
    const result = [];
    let lastPainter = null;

    // greedy interleave
    while (true) {
      const available = painters
        .filter(p => groups.get(p).length > 0)
        .sort((a, b) => groups.get(b).length - groups.get(a).length);

      if (available.length === 0) break;

      const pick = available.find(p => p !== lastPainter) || available[0];
      result.push(groups.get(pick).shift());
      lastPainter = pick;
    }

    // post-pass swap to fix accidental adjacency if possible
    for (let i = 1; i < result.length; i++) {
      if (painterOf(result[i]) === painterOf(result[i - 1])) {
        let j = i + 1;
        while (j < result.length && painterOf(result[j]) === painterOf(result[i])) j++;
        if (j < result.length) {
          const tmp = result[i];
          result[i] = result[j];
          result[j] = tmp;
        }
      }
    }

    return result;
  }

  function render() {
    if (!ordered.length) return;
    const file = ordered[idx];
    imgEl.src = BASE + encodeURIComponent(file);
    counterEl.textContent = `${idx + 1} / ${ordered.length}`;
  }

  function next() {
    if (!ordered.length) return;
    idx = (idx + 1) % ordered.length;
    render();
  }

  function prev() {
    if (!ordered.length) return;
    idx = (idx - 1 + ordered.length) % ordered.length;
    render();
  }

  document.getElementById("nextBtn").addEventListener("click", next);
  document.getElementById("prevBtn").addEventListener("click", prev);

  imgEl.addEventListener("click", next);
  stageEl.addEventListener("click", (e) => {
    if (e.target === stageEl) next();
  });

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") next();
    if (e.key === "ArrowLeft") prev();
  });

  (async function init() {
    const res = await fetch(MANIFEST, { cache: "no-store" });
    if (!res.ok) {
      counterEl.textContent = "manifest not found";
      return;
    }

    const files = await res.json();

    // keep only image files
    const filtered = files.filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f));

    // THIS is the randomization step (runs fresh on every page load)
    ordered = buildNonAdjacentOrder(filtered);

    idx = 0;
    render();
  })();
</script>

  </body>
</html>
